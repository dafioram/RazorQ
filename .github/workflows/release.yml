name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, format: gztar, ext: "" }
          - { os: windows-latest, platform: windows-x86_64, format: zip, ext: ".exe" }
          - { os: macos-latest, platform: macos-arm64, format: gztar, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: cargo test --locked -p rqz-ecc -p rqz-core -p rqz-cli
      - name: Build CLI and GUI
        run: cargo build --locked --release -p rqz-cli -p rqz-gui
      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || format('build-{0}', github.run_number) }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_FORMAT: ${{ matrix.format }}
          EXE_SUFFIX: ${{ matrix.ext }}
        run: |
          mkdir -p package assets
          cp "target/release/rqz${EXE_SUFFIX}" "target/release/rqz-gui${EXE_SUFFIX}" README.md LICENSE package/
          python - <<'PY'
          import os
          import shutil

          tag = os.environ["RELEASE_TAG"]
          if not tag or "/" in tag or "\\" in tag:
              raise SystemExit(f"Tag cannot be used in asset filenames: {tag!r}")
          name = f"razerq-{tag}-{os.environ['PLATFORM']}"
          shutil.make_archive(f"assets/{name}", os.environ["ARCHIVE_FORMAT"], root_dir="package")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: assets/*
          if-no-files-found: error

  publish:
    name: Attach binaries to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" assets/*
