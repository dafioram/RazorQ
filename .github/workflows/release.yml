name: Release

# Push a tag like v0.1.0 to build binaries for every platform.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, ext: "" }
          - { os: windows-latest, name: windows-x86_64, ext: ".exe" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rqz-cli -p rqz-gui
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/rqz${{ matrix.ext }} target/release/rqz-gui${{ matrix.ext }} dist/
          cp README.md LICENSE dist/
          tar -czf razerq-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: razerq-*.tar.gz
