[package]
name = "rqz-wasm"
description = "razerq in the browser: open, check, repair and create archives locally (WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features: pure-Rust codecs, no threads, no filesystem.
rqz-core = { path = "../rqz-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
