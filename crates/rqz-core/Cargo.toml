[package]
name = "rqz-core"
description = "razerq archive format: compression + RaptorQ erasure coding in one self-healing container"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["native"]
# Everything the desktop tools want. The WASM build turns all of this off.
native = ["parallel", "zstd-native", "fs"]
parallel = ["dep:rayon"]
zstd-native = ["dep:zstd"]
fs = ["dep:walkdir", "dep:zip", "dep:tar", "dep:flate2"]

[dependencies]
rqz-ecc = { path = "../rqz-ecc" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
blake3 = "1"
crc32c = "0.6"
lz4_flex = "0.14"
ruzstd = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
rayon = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
walkdir = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
