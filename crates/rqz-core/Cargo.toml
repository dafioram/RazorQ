[package]
name = "rqz-core"
description = "razerq archive format: compression + RaptorQ erasure coding in one self-healing container"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["native"]
# Everything the desktop tools want. The WASM build turns all of this off.
native = ["parallel", "zstd-native", "fs"]
parallel = ["dep:rayon"]
zstd-native = ["dep:zstd"]
fs = ["dep:walkdir", "dep:zip", "dep:tar", "dep:flate2", "dep:tempfile", "dep:cap-std", "dep:cap-fs-ext", "dep:rustix"]

[dependencies]
rqz-ecc = { path = "../rqz-ecc" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
blake3 = "1"
crc32c = "0.6"
lz4_flex = "0.14"
ruzstd = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
rayon = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
walkdir = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
cap-std = { version = "4", optional = true }
cap-fs-ext = { version = "4", optional = true }

# Browser builds need getrandom's JS backend. Declared here so rqz-core builds for wasm32 on its own,
# not only when pulled in through rqz-wasm.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"], optional = true }
