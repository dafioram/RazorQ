[workspace]
resolver = "2"
members = ["crates/rqz-ecc", "crates/rqz-core", "crates/rqz-cli", "crates/rqz-gui", "crates/rqz-wasm"]
default-members = ["crates/rqz-ecc", "crates/rqz-core", "crates/rqz-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/YOUR_NAME/razerq"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.rqz-ecc]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.rqz-core]
opt-level = 1
